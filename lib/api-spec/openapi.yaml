openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI-powered Resume Maker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: resumes
    description: Resume management
  - name: templates
    description: Resume templates
  - name: ai
    description: AI assistance
  - name: dashboard
    description: Dashboard analytics
  - name: cover-letters
    description: Cover letter management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /resumes:
    get:
      operationId: listResumes
      tags: [resumes]
      summary: List all resumes for the authenticated user
      responses:
        "200":
          description: List of resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createResume
      tags: [resumes]
      summary: Create a new resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResumeBody"
      responses:
        "201":
          description: Created resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
               schema:
                 $ref: "#/components/schemas/ErrorResponse"

  /resumes/import:
    post:
      operationId: importResume
      tags: [resumes]
      summary: Import an existing resume from PDF or DOCX
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportResumeBody"
      responses:
        "201":
          description: Created resume from import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: Validation or parsing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error during import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumes/{id}:
    get:
      operationId: getResume
      tags: [resumes]
      summary: Get a resume by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateResume
      tags: [resumes]
      summary: Update a resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResumeBody"
      responses:
        "200":
          description: Updated resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteResume
      tags: [resumes]
      summary: Delete a resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumes/{id}/duplicate:
    post:
      operationId: duplicateResume
      tags: [resumes]
      summary: Duplicate a resume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumes/{id}/export:
    post:
      operationId: exportResume
      tags: [resumes]
      summary: Export resume to PDF or DOCX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportResumeBody"
      responses:
        "200":
          description: Export URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumes/{id}/ats-score:
    get:
      operationId: getAtsScore
      tags: [resumes]
      summary: Get ATS score for a resume
      description: Requires an active Pro subscription (same source as Clerk publicMetadata.isPremium).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: jobDescription
          in: query
          required: false
          schema:
            type: string
        - name: forceScan
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: ATS score result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsScore"
        "403":
          description: Pro subscription required for ATS score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resumes/{id}/optimize:
    post:
      operationId: optimizeResume
      tags: [resumes]
      summary: Optimize resume content with AI based on a job description
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeResumeBody"
      responses:
        "200":
          description: Optimized resume details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResumeResponse"
        "403":
          description: Pro subscription required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all available resume templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics for the user
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/generate-summary:
    post:
      operationId: generateSummary
      tags: [ai]
      summary: Generate a professional summary using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSummaryBody"
      responses:
        "200":
          description: Generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTextResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/improve-bullet:
    post:
      operationId: improveBullet
      tags: [ai]
      summary: Improve a bullet point using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImproveBulletBody"
      responses:
        "200":
          description: Improved bullet point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTextResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/suggest-skills:
    post:
      operationId: suggestSkills
      tags: [ai]
      summary: Suggest skills based on job role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestSkillsBody"
      responses:
        "200":
          description: Suggested skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSkillsResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/ats-suggestions:
    post:
      operationId: getAtsSuggestions
      tags: [ai]
      summary: Get ATS optimization suggestions for resume content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtsSuggestionsBody"
      responses:
        "200":
          description: ATS suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsSuggestionsResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cover-letters:
    get:
      operationId: listCoverLetters
      tags: [cover-letters]
      summary: List all cover letters for the authenticated user
      parameters:
        - name: resumeId
          in: query
          required: false
          schema:
            type: integer
        - name: isArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of cover letters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverLetter"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCoverLetter
      tags: [cover-letters]
      summary: Create a new cover letter draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoverLetterBody"
      responses:
        "201":
          description: Created cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cover-letters/generate:
    post:
      operationId: generateCoverLetter
      tags: [cover-letters]
      summary: Generate a cover letter using AI (3 creation flows)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCoverLetterBody"
      responses:
        "201":
          description: Generated cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cover-letters/scrape-job:
    post:
      operationId: scrapeJobDetails
      tags: [cover-letters]
      summary: Scrape job description and details from URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeJobBody"
      responses:
        "200":
          description: Scraped details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeJobResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cover-letters/export-pdf:
    post:
      operationId: exportCoverLetterPdf
      tags: [cover-letters]
      summary: Export cover letter HTML as PDF file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPdfBody"
      responses:
        "200":
          description: PDF binary file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cover-letters/{id}:
    get:
      operationId: getCoverLetter
      tags: [cover-letters]
      summary: Get cover letter details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cover letter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCoverLetter
      tags: [cover-letters]
      summary: Update cover letter details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoverLetterBody"
      responses:
        "200":
          description: Updated cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCoverLetter
      tags: [cover-letters]
      summary: Delete cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "404":
          description: Not found

  /cover-letters/{id}/duplicate:
    post:
      operationId: duplicateCoverLetter
      tags: [cover-letters]
      summary: Duplicate a cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "404":
          description: Not found

  /cover-letters/{id}/regenerate:
    post:
      operationId: regenerateCoverLetter
      tags: [cover-letters]
      summary: Regenerate cover letter content using AI and save previous to history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateCoverLetterBody"
      responses:
        "200":
          description: Regenerated cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "404":
          description: Not found

  /cover-letters/{id}/versions:
    get:
      operationId: getCoverLetterVersions
      tags: [cover-letters]
      summary: Get list of previous versions of the cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverLetterVersion"
        "404":
          description: Not found

  /cover-letters/{id}/versions/{versionId}/restore:
    post:
      operationId: restoreCoverLetterVersion
      tags: [cover-letters]
      summary: Restore a previous version of the cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverLetter"
        "404":
          description: Not found

  /cover-letters/{id}/ats-score:
    post:
      operationId: auditCoverLetterAts
      tags: [cover-letters]
      summary: Get ATS score audit and recommendations for the cover letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtsScoreBody"
      responses:
        "200":
          description: ATS score details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsScore"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Resume:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        templateId:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        fontColor:
          type: string
        backgroundColor:
          type: string
        isPublic:
          type: boolean
        shareToken:
          type: ["string", "null"]
        viewCount:
          type: integer
        downloadCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        atsScore:
          type: integer
          nullable: true
        atsPassedChecks:
          type: array
          items:
            type: string
          nullable: true
        atsFailedChecks:
          type: array
          items:
            type: string
          nullable: true
        atsFeedback:
          type: array
          items:
            type: string
          nullable: true
        atsUpdatedAt:
          type: string
          format: date-time
          nullable: true
        atsJobDescription:
          type: string
          nullable: true
      required:
        - id
        - userId
        - title
        - templateId
        - accentColor
        - fontFamily
        - fontColor
        - backgroundColor
        - isPublic
        - shareToken
        - viewCount
        - downloadCount
        - createdAt
        - updatedAt

    ResumeDetail:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        templateId:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        fontColor:
          type: string
        backgroundColor:
          type: string
        isPublic:
          type: boolean
        shareToken:
          type: ["string", "null"]
        viewCount:
          type: integer
        downloadCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        atsScore:
          type: integer
          nullable: true
        atsPassedChecks:
          type: array
          items:
            type: string
          nullable: true
        atsFailedChecks:
          type: array
          items:
            type: string
          nullable: true
        atsFeedback:
          type: array
          items:
            type: string
          nullable: true
        atsUpdatedAt:
          type: string
          format: date-time
          nullable: true
        atsJobDescription:
          type: string
          nullable: true
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ResumeSection"
      required:
        - id
        - userId
        - title
        - templateId
        - accentColor
        - fontFamily
        - fontColor
        - backgroundColor
        - isPublic
        - shareToken
        - viewCount
        - downloadCount
        - createdAt
        - updatedAt
        - sections

    ResumeSection:
      type: object
      properties:
        id:
          type: integer
        resumeId:
          type: integer
        type:
          type: string
        title:
          type: string
        content:
          type: object
        displayOrder:
          type: integer
        isVisible:
          type: boolean
      required:
        - id
        - resumeId
        - type
        - title
        - content
        - displayOrder
        - isVisible

    CreateResumeBody:
      type: object
      properties:
        title:
          type: string
        templateId:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        fontColor:
          type: string
        backgroundColor:
          type: string
        startPrefilled:
          type: boolean
          description: When true (default), new resume sections include sample starter content. When false, sections are empty shells for the template.
      required:
        - title
        - templateId

    ImportResumeBody:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The PDF or DOCX file to import
      required:
        - file

    UpdateResumeBody:
      type: object
      properties:
        title:
          type: string
        templateId:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        fontColor:
          type: string
        backgroundColor:
          type: string
        isPublic:
          type: boolean
        sections:
          type: array
          items:
            $ref: "#/components/schemas/UpdateSectionItem"
        atsScore:
          type: integer
          nullable: true
        atsPassedChecks:
          type: array
          items:
            type: string
          nullable: true
        atsFailedChecks:
          type: array
          items:
            type: string
          nullable: true
        atsFeedback:
          type: array
          items:
            type: string
          nullable: true
        atsUpdatedAt:
          type: string
          format: date-time
          nullable: true
        atsJobDescription:
          type: string
          nullable: true

    UpdateSectionItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        content:
          type: object
        displayOrder:
          type: integer
        isVisible:
          type: boolean
      required:
        - id

    ExportResumeBody:
      type: object
      properties:
        format:
          type: string
          enum: [pdf, docx, json]
      required:
        - format

    ExportResult:
      type: object
      properties:
        url:
          type: string
        format:
          type: string
      required:
        - url
        - format

    OptimizeResumeBody:
      type: object
      properties:
        jobDescription:
          type: string

    OptimizeResumeResponse:
      type: object
      properties:
        resume:
          $ref: "#/components/schemas/ResumeDetail"
        summary:
          type: string
      required:
        - resume
        - summary

    AtsScore:
      type: object
      properties:
        score:
          type: integer
        maxScore:
          type: integer
        feedback:
          type: array
          items:
            type: string
        passedChecks:
          type: array
          items:
            type: string
        failedChecks:
          type: array
          items:
            type: string
        atsUpdatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - score
        - maxScore
        - feedback
        - passedChecks
        - failedChecks

    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        previewImageUrl:
